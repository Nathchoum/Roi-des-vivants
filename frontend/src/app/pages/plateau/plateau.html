<div class="plateau-container">
  <h2>Plateau de Jeu</h2>
  <div class="cycle">
    <p>Cycle actuel :{{ partie?.cycle || 'Non démarré' }}</p>
    <button class="bouton-action" (click)="changerCycle()">Changer Cycle</button>
  </div>


  <div class="joueur">

    <p>Tu es : {{ monJoueur?.pseudo || 'anonyme' }}</p>
    <p>Joueur actif : {{ joueurCourant?.pseudo }} ({{ joueurCourant?.etat }})</p>

    <h3>Joueurs présents</h3>
    <ul>
      <li *ngFor="let joueur of room?.joueurs">
        {{ joueur.pseudo }} — {{ joueur.etat }}
      </li>
    </ul>
    </div>


  <div class="action" *ngIf="joueurCourant">
    <h3>Actions disponibles :</h3>
    <button class="bouton-action" (click)="actionRegarderCarte()">1. Regarder sa carte</button>
    <button class="bouton-action" (click)="actionDevinerFaction()">2. Deviner Faction</button>
    <button class="bouton-action" (click)="actionComparer()">3. Comparer</button>
    <button class="bouton-action" (click)="actionTuer()">4. Tuer</button>
  </div>

   <div class="init" >
    <p></p>
    <button class="bouton-init" (click)="initRoom()">Initialiser la room fdp </button>
  </div>
  <div class="init" >
    <p></p>
    <button class="bouton-rejoindre" (click)="rejoindreRoom()">rejoindre room</button>
  </div>
  <div class="init" >
    <p></p>
    <button class="bouton-init" (click)="initPartie()">Initialiser la partie</button>
  </div>
  <div class="resultat" *ngIf="messageRetour">
    <p>{{ messageRetour }}</p>
  </div>
</div>
